

services:
  # ========== ELASTICSEARCH ==========
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.3
    container_name: smartsupply-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    networks:
      - elk

  # ========== LOGSTASH ==========
  logstash:
    image: docker.elastic.co/logstash/logstash:8.11.3
    container_name: smartsupply-logstash
    volumes:
      - ./logstash/pipeline:/usr/share/logstash/pipeline:ro
    environment:
      - "LS_JAVA_OPTS=-Xms256m -Xmx256m"
    ports:
      - "5000:5000"
    depends_on:
      - elasticsearch
    networks:
      - elk

  # ========== KIBANA ==========
  kibana:
    image: docker.elastic.co/kibana/kibana:8.11.3
    container_name: smartsupply-kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "5601:5601"
    depends_on:
      - elasticsearch
    networks:
      - elk

  # ========== KEYCLOAK ==========
  keycloak:
    image: quay.io/keycloak/keycloak:23.0.0
    container_name: smartsupply-keycloak
    environment:
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=admin
    command: start-dev
    ports:
      - "8180:8080"
    networks:
      - elk

# ========== VOLUMES ==========
volumes:
  elasticsearch-data:
    driver: local

# ========== NETWORKS ==========
networks:
  elk:
    driver: bridge