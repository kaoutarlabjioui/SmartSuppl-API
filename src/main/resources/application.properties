spring.application.name=smartsupply
spring.datasource.url=jdbc:postgresql://localhost:5432/smartsupply
spring.datasource.username=postgres
spring.datasource.password=0000
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# AOP Configuration
spring.aop.auto=true
spring.aop.proxy-target-class=true

# Logging
logging.level.org.smartsupply.SmartSupply.aspect=DEBUG
logging.level.org.smartsupply.SmartSupply=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.org.springframework.security.web=DEBUG
logging.level.org.springframework.security.web.FilterChainProxy=DEBUG

# Fichiers de log
logging.file.name=logs/smartsupply.log
logging.file.path=logs
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %highlight(%-5level) %cyan(%logger{36}) - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm: ss} [%thread] %-5level %logger{36} - %msg%n

# ========== ELASTICSEARCH ==========
spring.elasticsearch.uris=http://localhost:9200
spring.elasticsearch.connection-timeout=5s
spring.elasticsearch.socket-timeout=30s
# Server
server.port=8081
server.servlet.context-path=/

# Scheduling (pour nettoyage des tokens expires)
spring.task.scheduling.enabled=true

# JWT Configuration
jwt.secret=votre-cle-secrete-super-longue-au-moins-256-bits-pour-hmac-sha256-securise-changez-moi-en-production
jwt.access-token-expiration=900000
jwt.refresh-token-expiration=604800000

# DESACTIVER COMPLETEMENT LES SESSIONS
server.servlet.session.tracking-modes=
server.servlet.session.cookie.http-only=false
server.servlet.session.cookie.secure=false
server.servlet.session.persistent=false
server.servlet.session.timeout=0s
spring.session.store-type=none

# ========== ACTUATOR ==========
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=30MB
server.tomcat.max-swallow-size=30MB

aws.accessKeyId=${AWS_ACCESS_KEY_ID}
aws.secretKey=${AWS_SECRET_KEY}
aws.region=${AWS_REGION}
aws.s3.bucket=${AWS_S3_BUCKET}