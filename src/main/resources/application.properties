spring.application.name=smartsupply
spring.datasource.url=jdbc:postgresql://localhost:5432/smartsupply
spring.datasource.username=postgres
spring.datasource.password=0000
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# AOP Configuration
spring.aop.auto=true
spring.aop.proxy-target-class=true

# Logging
logging.level.org.smartsupply.SmartSupply.aspect=DEBUG
logging.level.org.smartsupply.SmartSupply=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.org.springframework.security.web=DEBUG
logging.level.org.springframework.security.web. FilterChainProxy=DEBUG


# Server
server.port=8081
server.servlet.context-path=/

# Scheduling (pour nettoyage des tokens expirés)
spring.task.scheduling.enabled=true

# JWT Configuration
jwt.secret=votre-cle-secrete-super-longue-au-moins-256-bits-pour-hmac-sha256-securise-changez-moi-en-production
jwt.access-token-expiration=900000
jwt.refresh-token-expiration=604800000

# DÉSACTIVER COMPLÈTEMENT LES SESSIONS
server.servlet.session.tracking-modes=
server.servlet.session.cookie. http-only=false
server.servlet.session.cookie.secure=false
server.servlet.session.persistent=false
server.servlet.session.timeout=0s
spring.session.store-type=none