spring.application.name=smartsupply
spring.datasource.url=jdbc:postgresql://localhost:5432/smartsupply
spring.datasource.username=postgres
spring.datasource.password=0000
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# AOP Configuration
spring.aop.auto=true
spring.aop.proxy-target-class=true

# Logging
logging.level.org.smartsupply.SmartSupply.aspect=DEBUG
logging.level.org.smartsupply.SmartSupply=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.org.springframework.security.web=DEBUG
logging.level.org.springframework.security.web.FilterChainProxy=DEBUG

# Fichiers de log
logging.file.name=logs/smartsupply.log
logging.file.path=logs
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %highlight(%-5level) %cyan(%logger{36}) - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# ========== ELASTICSEARCH ==========
spring.elasticsearch.uris=http://localhost:9200
spring.elasticsearch.connection-timeout=5s
spring.elasticsearch.socket-timeout=30s
# Server
server.port=8081
server.servlet.context-path=/

# Scheduling (pour nettoyage des tokens expires)
spring.task.scheduling.enabled=true

# Keycloak Configuration
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8180/realms/smartsupply
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8180/realms/smartsupply/protocol/openid-connect/certs

# Keycloak Admin Configuration
keycloak.auth-server-url=http://localhost:8180
keycloak.realm=smartsupply
keycloak.resource=smartsupply-api
keycloak.admin.username=admin
keycloak.admin.password=admin

# DESACTIVER COMPLETEMENT LES SESSIONS
server.servlet.session.tracking-modes=
server.servlet.session.cookie.http-only=false
server.servlet.session.cookie.secure=false
server.servlet.session.persistent=false
server.servlet.session.timeout=0s
spring.session.store-type=none

# ========== ACTUATOR ==========
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always